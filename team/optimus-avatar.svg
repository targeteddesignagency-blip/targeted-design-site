<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="obg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a1508"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="oglow" cx="50%" cy="47%" r="35%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="oface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a3f2a"/>
      <stop offset="30%" stop-color="#3a3020"/>
      <stop offset="70%" stop-color="#2a2015"/>
      <stop offset="100%" stop-color="#1a1508"/>
    </linearGradient>
    <linearGradient id="oeyeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="oeyeBloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#obg)"/>
  <ellipse cx="512" cy="480" rx="300" ry="320" fill="url(#oglow)"/>

  <!-- Main face shape -->
  <polygon points="512,180 680,280 720,450 650,650 512,750 374,650 304,450 344,280" fill="url(#oface)" stroke="#d97706" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Horizontal panel lines -->
  <g stroke="#d97706" stroke-width="0.8" stroke-opacity="0.3" fill="none">
    <line x1="370" y1="260" x2="654" y2="260"/>
    <line x1="355" y1="320" x2="669" y2="320"/>
    <line x1="345" y1="380" x2="679" y2="380"/>
    <line x1="340" y1="440" x2="684" y2="440"/>
    <line x1="345" y1="500" x2="679" y2="500"/>
    <line x1="355" y1="560" x2="669" y2="560"/>
    <line x1="370" y1="620" x2="654" y2="620"/>
  </g>

  <!-- Circuit traces - warm amber/gold -->
  <g stroke="#d97706" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="380,300 420,300 420,360 460,360"/>
    <polyline points="360,400 400,400 400,460 380,460"/>
    <polyline points="370,500 410,500 410,540"/>
    <polyline points="644,300 604,300 604,360 564,360"/>
    <polyline points="664,400 624,400 624,460 644,460"/>
    <polyline points="654,500 614,500 614,540"/>
  </g>

  <!-- Circuit nodes -->
  <g fill="#f59e0b" opacity="0.8">
    <circle cx="420" cy="300" r="3"/><circle cx="420" cy="360" r="3"/><circle cx="460" cy="360" r="3"/>
    <circle cx="400" cy="400" r="3"/><circle cx="400" cy="460" r="3"/><circle cx="410" cy="500" r="3"/>
    <circle cx="410" cy="540" r="3"/>
    <circle cx="604" cy="300" r="3"/><circle cx="604" cy="360" r="3"/><circle cx="564" cy="360" r="3"/>
    <circle cx="624" cy="400" r="3"/><circle cx="624" cy="460" r="3"/><circle cx="614" cy="500" r="3"/>
    <circle cx="614" cy="540" r="3"/>
  </g>

  <!-- Brow line - amber accent -->
  <polyline points="400,340 512,315 624,340" stroke="#f59e0b" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- Cheek structure -->
  <g stroke="#d97706" stroke-width="1.5" fill="none" opacity="0.4">
    <polyline points="380,420 430,460 400,500"/>
    <polyline points="644,420 594,460 624,500"/>
  </g>

  <!-- LEFT EYE - amber/gold -->
  <ellipse cx="455" cy="394" rx="45" ry="25" fill="url(#oeyeBloom)"/>
  <rect x="430" y="390" width="50" height="8" rx="2" fill="url(#oeyeGlow)"/>
  <rect x="438" y="392" width="34" height="4" rx="1" fill="#fcd34d" opacity="0.6"/>

  <!-- RIGHT EYE - amber/gold -->
  <ellipse cx="569" cy="394" rx="45" ry="25" fill="url(#oeyeBloom)"/>
  <rect x="544" y="390" width="50" height="8" rx="2" fill="url(#oeyeGlow)"/>
  <rect x="552" y="392" width="34" height="4" rx="1" fill="#fcd34d" opacity="0.6"/>

  <!-- Chin accent -->
  <polyline points="440,680 512,720 584,680" stroke="#d97706" stroke-width="1" fill="none" opacity="0.3"/>

  <!-- Gold highlights -->
  <g stroke="#fbbf24" stroke-width="1" fill="none" opacity="0.15">
    <polyline points="400,230 450,280 430,330"/>
    <polyline points="624,230 574,280 594,330"/>
  </g>

  <text x="512" y="830" text-anchor="middle" font-family="monospace" font-size="16" fill="rgba(255,255,255,0.5)">OPTIMUS — AI Research Director</text>
  <text x="512" y="855" text-anchor="middle" font-family="monospace" font-size="14" fill="rgba(255,255,255,0.35)">Targeted.Design</text>
</svg>